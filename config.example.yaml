# Copy to config.yaml and adjust. CLI flags override anything set here.
# OPENROUTER_API_KEY env var overrides openrouter_api_key set here.
# LOCAL_API_KEY env var overrides local_api_key set here.

# provider: claude_code (default — runs `claude -p` under your existing
# Claude Code CLI login/subscription, no API key needed), openrouter
# (cloud), or local (any OpenAI-compatible server: llama.cpp server, Ollama,
# LM Studio, vLLM, ...). Override per run with `--provider openrouter` /
# `--provider local`; --model and --workers work the same across all three.
# If you switch provider without also setting model below, config.py picks
# a provider-appropriate default (claude-sonnet-5 for claude_code,
# deepseek/deepseek-v3.2 otherwise) rather than silently reusing whatever
# model id you had for the other provider.
provider: claude_code
model: claude-sonnet-5
workers: 4
sequential: true
temperature: 0
max_retries: 5
cache: true
validate: true
repair: true
max_repair_attempts: 2

source_lang: en
target_lang: sq
source_wiki_api: https://en.wikipedia.org/w/api.php

chunk_min_tokens: 1500
chunk_max_tokens: 2500

# Directory (or list of directories) containing SKILL.md for the Pi skill.
# The skill is split across three directories — enwiki-sqwiki-translation
# (translate), wikiterms (terminology/link verification), wikiqa (pre-delivery
# checklist) — that an interactive agent invokes on demand via a Skill tool.
# This harness has no such mechanism, so it loads all three up front and
# concatenates them into one system prompt; list translate first, since its
# content frames the other two. A single path (just translate) also still
# works, e.g. if you want the harness's own verification.py to fully replace
# wikiterms's role instead of also sending the model that skill's text.
skill_path:
  - ~/.claude/skills/enwiki-sqwiki-translation
  - ~/.claude/skills/wikiterms
  - ~/.claude/skills/wikiqa
# On: sqwiki-verified.md's confirmed template names/params reach the model.
# Costs more tokens per request; off falls back to guessing on anything not
# covered by the harness's own live verification (see wiki_translate_harness/verification.py).
include_skill_references: true
# Pin the skill(s) to a committed git revision instead of the working tree, so
# local uncommitted edits in the skill's own repo don't silently change
# translation behavior. Each skill_path directory must be inside a git
# working copy of its repo. Set to null (or remove) to read the live working
# tree instead.
skill_git_ref: HEAD

# Defaults into the shared wiki-translate-queue repo's output/ folder, same
# place wikitranslateautorun/mmtp/wikipedia-articles-translation put theirs.
# Point at a plain local `output` instead if you don't want that.
output_dir: ~/code/wiki-translate-queue/output
cache_db_path: cache/translation_memory.sqlite3
log_dir: logs
stats_path: stats.json

# openrouter_api_key: sk-or-...   # prefer the OPENROUTER_API_KEY env var instead
openrouter_base_url: https://openrouter.ai/api/v1

# Used only when provider: local. Default matches llama.cpp server's
# OpenAI-compatible endpoint (`llama-server -m model.gguf --port 8080`);
# change to point at Ollama (http://localhost:11434/v1), LM Studio
# (http://localhost:1234/v1), vLLM, etc. Most local servers ignore
# local_api_key; some require any non-empty string.
# local_base_url: http://localhost:8080/v1
# local_api_key: local
# local_model: llama-3.1-8b-instruct   # falls back to `model` if unset

# Used only when provider: claude_code. claude_code_cli_path is the `claude`
# binary to invoke (override if it's not on PATH); claude_code_permission_mode
# is passed straight to `claude -p --permission-mode` (defense in depth —
# every call already runs with --tools "" disabling all tool use, so there's
# nothing for a permission prompt to fire on either way).
# claude_code_cli_path: claude
# claude_code_permission_mode: bypassPermissions
# Sized for the largest oversized-section chunks (never split further, so a
# protected table/template can push a single chunk to 10k+ input tokens) —
# confirmed a real 12k-input/7k-output completion can legitimately take
# over 5 minutes end to end.
request_timeout_s: 600

# Required by Wikimedia's User-Agent policy for automated requests to
# en.wikipedia.org, sq.wikipedia.org, and wikidata.org — an email or URL
# where the operator of this tool can be reached.
# (https://foundation.wikimedia.org/wiki/Policy:User-Agent_policy)
wikimedia_tool_name: wiki-translate-harness
wikimedia_contact: you@example.com

# Harness-side link/template verification against Wikidata + the target
# wiki (see wiki_translate_harness/verification.py) — the harness's own,
# growing equivalent of the skill's sqwiki-verified.md, fed into each
# chunk's translation request as pre-checked facts instead of the model
# having to guess. Persisted in verification_db_path across runs.
verify_links: true
verification_db_path: cache/verified_facts.sqlite3
wikidata_timeout_s: 20
verification_timeout_s: 60
generate_reports: true

# Whole-article checks on the assembled article: static (validator.py —
# malformed {{convert}} args, {{harvc}} usage, unsupported Sfn |text=,
# wikitable rowspan/colspan mismatches, plus the existing structural
# checks) always run; live_validate additionally renders the article via
# the target wiki's action=parse API (see live_validator.py) to catch Lua
# errors, Cite errors (including an orphaned named ref), templates that
# don't exist, and leaked raw {{flagicon}}/{{flag}} "Country data ..."
# text — defects that don't show up in raw wikitext at all. On failure,
# the harness re-prompts the model with only the affected chunk(s) and
# their specific findings, re-validates, up to max_assembly_repair_rounds
# — if issues remain after that, the article is written to
# needs_human_review.json + {title}.review.md in output_dir instead of
# being saved. Independent of max_repair_attempts, which governs the
# separate per-chunk structural/degenerate-repetition repair loop that
# runs before assembly.
live_validate: true
live_validate_timeout_s: 30
max_assembly_repair_rounds: 3

# Fills any citation missing |language= in the final assembled article, and
# renames citation parameter *names* mistranslated into the target language
# back to English CS1 equivalents (|titulli= -> |title=, etc). Also
# reconciles {{sfn}}/{{harvnb}} calls whose |ps= quote diverged because the
# same source citation was split across independently-translated chunks.
# See wiki_translate_harness/citation_language.py.
fill_citation_languages: true
max_citation_url_fetches: 40
citation_fetch_concurrency: 5
citation_fetch_timeout_s: 10
citation_fill_timeout_s: 60
fix_citation_param_names: true
dedupe_short_footnotes: true

# Article-level limits to skip articles that take too long or consume too many tokens.
# Timeout for translation phase only (fetching, verification, and post‑processing are
# separately bounded by request_timeout_s, verification_timeout_s, citation_fill_timeout_s).
article_timeout_s: 3600  # 1 hour per article (with workers=4 + openrouter's true concurrency)

# Maximum allowed ratio of output tokens to input tokens per article.
# A ratio > 1 is expected (translation often expands text), but extremely high ratios
# suggest a runaway generation (e.g., the model started repeating or hallucinating).
# Set to 0 to disable.
max_token_ratio: 5.0

# Maximum total tokens (input + output) allowed per article. Zero means unlimited.
max_article_tokens: 0
