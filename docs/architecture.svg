<svg viewBox="0 0 990 770" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Translation pipeline in three stages. Prepare: fetch the article, verify links and templates against Wikidata and the target wiki, split into chunks. Per chunk, in parallel: reuse a cached translation if one exists, otherwise translate with the skill and verified facts through one of five engines, validate, and repair up to a limit; a chunk that stays invalid fails the article. Whole article: assemble, apply deterministic fixes and validate, repair the affected chunks for a limited number of rounds or withhold the article for human review, run an optional semantic review, then write the .wiki file and the report.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="990" height="770" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#111111">

  <!-- Stage 1: prepare -->
  <text x="30" y="22" font-size="12" fill="#444" font-style="italic">1. Prepare</text>

  <rect x="30" y="35" width="210" height="60" rx="6" fill="#f3f4f6" stroke="#333"/>
  <text x="135" y="58" font-size="12.5" text-anchor="middle" font-weight="bold">Entry points</text>
  <text x="135" y="75" font-size="11" text-anchor="middle">cli.py · queue_runner.py</text>
  <text x="135" y="88" font-size="11" text-anchor="middle">benchmark.py</text>
  <line x1="240" y1="65" x2="280" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="35" width="210" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="385" y="58" font-size="12.5" text-anchor="middle" font-weight="bold">Fetch article</text>
  <text x="385" y="75" font-size="11" text-anchor="middle">Wikipedia API · --file · --directory</text>
  <text x="385" y="88" font-size="11" text-anchor="middle" fill="#444">sources.py</text>
  <line x1="490" y1="65" x2="530" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="35" width="210" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="635" y="58" font-size="12.5" text-anchor="middle" font-weight="bold">Verify facts</text>
  <text x="635" y="75" font-size="11" text-anchor="middle">links and templates vs. Wikidata</text>
  <text x="635" y="88" font-size="11" text-anchor="middle">and target wiki (verification.py)</text>
  <line x1="740" y1="65" x2="780" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="35" width="180" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="870" y="58" font-size="12.5" text-anchor="middle" font-weight="bold">Split into chunks</text>
  <text x="870" y="75" font-size="11" text-anchor="middle">by section</text>
  <text x="870" y="88" font-size="11" text-anchor="middle" fill="#444">parser.py</text>

  <!-- chunks enter the per-chunk loop -->
  <path d="M 870,95 L 870,118 L 50,118 L 50,275 L 75,275" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: per-chunk loop -->
  <rect x="30" y="140" width="930" height="295" rx="10" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="163" font-size="12" fill="#444" font-style="italic">2. For each chunk (up to N in parallel)</text>

  <polygon points="150,245 225,275 150,305 75,275" fill="#fff7ed" stroke="#333"/>
  <text x="150" y="272" font-size="12" text-anchor="middle">cache.py</text>
  <text x="150" y="287" font-size="12" text-anchor="middle">hit?</text>

  <!-- cache hit: skip straight to chunk ready -->
  <path d="M 150,245 L 150,198 L 840,198 L 840,245" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="500" y="190" font-size="11" fill="#15803d" text-anchor="middle">yes: reuse the stored translation</text>

  <line x1="225" y1="275" x2="270" y2="275" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="247" y="267" font-size="11" fill="#444" text-anchor="middle">no</text>

  <rect x="270" y="245" width="210" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="375" y="268" font-size="12.5" text-anchor="middle" font-weight="bold">Translate</text>
  <text x="375" y="285" font-size="11" text-anchor="middle">skill + wikiterms + verified facts</text>
  <text x="375" y="298" font-size="10.5" text-anchor="middle" fill="#444">skill_loader.py · translator.py</text>

  <!-- engines -->
  <line x1="375" y1="305" x2="375" y2="340" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="45" y="340" width="435" height="80" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="262" y="360" font-size="12" text-anchor="middle" font-weight="bold">Engine: one chat_completion() interface (engines.py)</text>
  <text x="262" y="377" font-size="11" text-anchor="middle">claude_code (default) · openrouter · local · experiential · opencode_go</text>
  <text x="262" y="393" font-size="10.5" text-anchor="middle" fill="#444">optional second model for infoboxes, tables and reference lists</text>
  <text x="262" y="408" font-size="10.5" text-anchor="middle" fill="#444">switches to a fallback engine when credits run out</text>

  <line x1="480" y1="275" x2="520" y2="275" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="600,245 680,275 600,305 520,275" fill="#fff7ed" stroke="#333"/>
  <text x="600" y="272" font-size="12" text-anchor="middle">validator.py</text>
  <text x="600" y="287" font-size="12" text-anchor="middle">valid?</text>

  <line x1="680" y1="275" x2="760" y2="275" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="720" y="267" font-size="11" fill="#15803d" text-anchor="middle">yes</text>
  <text x="720" y="293" font-size="10.5" fill="#444" text-anchor="middle">store in cache</text>

  <rect x="760" y="245" width="160" height="60" rx="6" fill="#f0fdf4" stroke="#333"/>
  <text x="840" y="279" font-size="12.5" text-anchor="middle" font-weight="bold">Chunk ready</text>

  <!-- repair loop -->
  <line x1="585" y1="302" x2="585" y2="345" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="577" y="328" font-size="11" fill="#b91c1c" text-anchor="end">no</text>
  <line x1="615" y1="345" x2="615" y2="302" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="623" y="328" font-size="11" fill="#444">fixed text, check again</text>

  <rect x="510" y="345" width="180" height="50" rx="6" fill="#fff7ed" stroke="#333"/>
  <text x="600" y="366" font-size="12.5" text-anchor="middle" font-weight="bold">Repair</text>
  <text x="600" y="382" font-size="10.5" text-anchor="middle">repair.py + wikiqa checklist</text>

  <line x1="690" y1="370" x2="740" y2="370" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="715" y="362" font-size="10.5" fill="#b91c1c" text-anchor="middle">N tries</text>

  <rect x="740" y="345" width="180" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="830" y="366" font-size="12.5" text-anchor="middle" font-weight="bold">Chunk failed</text>
  <text x="830" y="382" font-size="10.5" text-anchor="middle">article fails, partial kept</text>

  <!-- chunks done, move to article stage -->
  <path d="M 920,275 L 942,275 L 942,455 L 115,455 L 115,500" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="448" font-size="11" fill="#444" text-anchor="middle">when every chunk is ready</text>

  <!-- Stage 3: whole article -->
  <text x="250" y="482" font-size="12" fill="#444" font-style="italic">3. Whole article</text>

  <rect x="30" y="500" width="170" height="50" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="115" y="530" font-size="12.5" text-anchor="middle" font-weight="bold">Assemble sections</text>
  <line x1="200" y1="525" x2="240" y2="525" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="490" width="260" height="70" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="370" y="511" font-size="12.5" text-anchor="middle" font-weight="bold">Fix and validate</text>
  <text x="370" y="528" font-size="10.5" text-anchor="middle">citation language and parameter fixes, sfn dedup</text>
  <text x="370" y="542" font-size="10.5" text-anchor="middle">static checks, optional live parse check</text>
  <text x="370" y="554" font-size="10" text-anchor="middle" fill="#444">citation_language.py · validator.py · live_validator.py</text>
  <line x1="500" y1="525" x2="520" y2="525" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="600,495 680,525 600,555 520,525" fill="#fff7ed" stroke="#333"/>
  <text x="600" y="529" font-size="12" text-anchor="middle">valid?</text>

  <line x1="680" y1="525" x2="740" y2="525" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="710" y="517" font-size="11" fill="#15803d" text-anchor="middle">yes</text>

  <rect x="740" y="490" width="200" height="70" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="840" y="511" font-size="12.5" text-anchor="middle" font-weight="bold">Semantic review</text>
  <text x="840" y="528" font-size="10.5" text-anchor="middle">optional, needs review_model</text>
  <text x="840" y="542" font-size="10.5" text-anchor="middle">findings repaired; the rest flagged,</text>
  <text x="840" y="554" font-size="10.5" text-anchor="middle">article still saved (review.py)</text>
  <line x1="840" y1="560" x2="840" y2="610" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="740" y="610" width="200" height="70" rx="6" fill="#f0fdf4" stroke="#333"/>
  <text x="840" y="631" font-size="12.5" text-anchor="middle" font-weight="bold">Write output</text>
  <text x="840" y="648" font-size="10.5" text-anchor="middle">Article.wiki (output.py)</text>
  <text x="840" y="662" font-size="10.5" text-anchor="middle">Article.report.md (report.py)</text>
  <text x="840" y="674" font-size="10" text-anchor="middle" fill="#444">Article.review-flags.md if any</text>

  <!-- assembly repair loop -->
  <line x1="600" y1="555" x2="600" y2="610" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="608" y="586" font-size="11" fill="#b91c1c">no</text>

  <rect x="500" y="610" width="200" height="50" rx="6" fill="#fff7ed" stroke="#333"/>
  <text x="600" y="631" font-size="12.5" text-anchor="middle" font-weight="bold">Repair affected chunks</text>
  <text x="600" y="647" font-size="10.5" text-anchor="middle">then re-assemble and re-check</text>

  <path d="M 500,635 L 370,635 L 370,563" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="435" y="627" font-size="10.5" fill="#444" text-anchor="middle">up to N rounds</text>

  <line x1="600" y1="660" x2="600" y2="700" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="608" y="685" font-size="10.5" fill="#b91c1c">rounds used up</text>

  <rect x="490" y="700" width="220" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="600" y="721" font-size="12.5" text-anchor="middle" font-weight="bold">needs_human_review.json</text>
  <text x="600" y="737" font-size="10.5" text-anchor="middle">article withheld, no .wiki written</text>

  </g>
</svg>
