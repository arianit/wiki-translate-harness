<svg viewBox="0 0 980 1010" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Per-chunk translation pipeline: fetch and split an article, then for each chunk check the translation-memory cache, build a prompt from the skill file plus verified facts, send it to one of three swappable engines, validate the result, repair and retry on failure or flag for human review after max retries, cache the success, then assemble, post-process, and write the output and report files.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="1010" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#111111">

  <!-- Entry points -->
  <rect x="230" y="10" width="460" height="40" rx="6" fill="#f3f4f6" stroke="#333"/>
  <text x="460" y="34" font-size="12.5" text-anchor="middle">cli.py (single / batch)  ·  queue_runner.py (persistent queue)  ·  benchmark.py (compare N models)</text>
  <line x1="460" y1="50" x2="460" y2="72" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Source -->
  <rect x="300" y="72" width="320" height="44" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="460" y="99" font-size="13" text-anchor="middle">Wikipedia API  /  --file  /  --directory</text>
  <line x1="460" y1="116" x2="460" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475" y="132" font-size="11" fill="#444">fetch (sources.py)</text>

  <!-- Parser -->
  <rect x="260" y="140" width="400" height="44" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="460" y="163" font-size="13" text-anchor="middle" font-weight="bold">parser.py</text>
  <text x="460" y="178" font-size="11.5" text-anchor="middle">split_into_sections() / build_chunks() → list[chunk]</text>
  <line x1="460" y1="184" x2="460" y2="206" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="200" font-size="11" text-anchor="middle" fill="#444">for each chunk, N workers in parallel</text>

  <!-- Loop container -->
  <rect x="40" y="216" width="900" height="546" rx="10" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="58" y="236" font-size="11.5" fill="#444" font-style="italic">per-chunk loop</text>

  <!-- Cache diamond -->
  <polygon points="460,246 560,286 460,326 360,286" fill="#fff7ed" stroke="#333"/>
  <text x="460" y="282" font-size="12" text-anchor="middle">cache.py</text>
  <text x="460" y="297" font-size="12" text-anchor="middle">hit?</text>

  <!-- cache hit bypass: routed through clear right-hand lane at x=900, outside every box -->
  <path d="M 560,286 L 900,286 L 900,750 L 460,750" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="890" y="279" font-size="11" fill="#15803d" text-anchor="end">yes — serve from translation_memory.sqlite3</text>

  <!-- cache miss -->
  <line x1="460" y1="326" x2="460" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="472" y="342" font-size="11" fill="#444">no</text>

  <!-- Prompt build -->
  <rect x="255" y="350" width="410" height="56" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="460" y="371" font-size="12.5" text-anchor="middle" font-weight="bold">skill_loader.py + verification.py</text>
  <text x="460" y="387" font-size="11" text-anchor="middle">system prompt = skill + wikiterms + verified facts block</text>
  <text x="460" y="401" font-size="10.5" text-anchor="middle" fill="#444">(link/template checks cached in verified_facts.sqlite3)</text>

  <line x1="460" y1="406" x2="460" y2="428" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- engines.py dispatch -->
  <rect x="330" y="428" width="260" height="34" rx="6" fill="#f3f4f6" stroke="#333"/>
  <text x="460" y="450" font-size="11.5" text-anchor="middle">engines.py — one duck-typed chat_completion()</text>

  <!-- branch lines to 3 engines -->
  <line x1="460" y1="462" x2="180" y2="488" stroke="#333" stroke-width="1.3"/>
  <line x1="460" y1="462" x2="460" y2="488" stroke="#333" stroke-width="1.3"/>
  <line x1="460" y1="462" x2="740" y2="488" stroke="#333" stroke-width="1.3"/>

  <rect x="80" y="488" width="200" height="46" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="180" y="507" font-size="11.5" text-anchor="middle" font-weight="bold">claude_code_client.py</text>
  <text x="180" y="521" font-size="10" text-anchor="middle">claude -p CLI (default)</text>

  <rect x="360" y="488" width="200" height="46" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="460" y="507" font-size="11.5" text-anchor="middle" font-weight="bold">openrouter.py</text>
  <text x="460" y="521" font-size="10" text-anchor="middle">HTTP API, real pricing</text>

  <rect x="640" y="488" width="200" height="46" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="740" y="507" font-size="11.5" text-anchor="middle" font-weight="bold">local server</text>
  <text x="740" y="521" font-size="10" text-anchor="middle">any OpenAI-compatible API</text>

  <!-- converge back down -->
  <line x1="180" y1="534" x2="460" y2="560" stroke="#333" stroke-width="1.3"/>
  <line x1="460" y1="534" x2="460" y2="560" stroke="#333" stroke-width="1.3"/>
  <line x1="740" y1="534" x2="460" y2="560" stroke="#333" stroke-width="1.3"/>
  <line x1="460" y1="560" x2="460" y2="580" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- validator diamond -->
  <polygon points="460,580 570,624 460,668 350,624" fill="#fff7ed" stroke="#333"/>
  <text x="460" y="620" font-size="12" text-anchor="middle">validator.py</text>
  <text x="460" y="636" font-size="12" text-anchor="middle">valid?</text>

  <!-- valid -> cache store -->
  <line x1="460" y1="668" x2="460" y2="690" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="474" y="682" font-size="11" fill="#15803d">yes</text>

  <rect x="300" y="690" width="320" height="40" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="460" y="715" font-size="11.5" text-anchor="middle">cache.py — store in translation_memory.sqlite3</text>

  <line x1="460" y1="730" x2="460" y2="762" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="745" font-size="10.5" fill="#444" font-style="italic">chunk done (translated or flagged)</text>

  <!-- invalid -> repair -->
  <line x1="570" y1="624" x2="650" y2="624" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="590" y="617" font-size="11" fill="#b91c1c">no</text>

  <rect x="650" y="600" width="190" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="745" y="619" font-size="11.5" text-anchor="middle" font-weight="bold">repair.py</text>
  <text x="745" y="633" font-size="10" text-anchor="middle">+ wikiqa checklist, retry</text>

  <!-- repair retries: routed through clear lane at x=865, outside the local-server box -->
  <path d="M 840,623 L 865,623 L 865,445 L 590,445" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="878" y="530" font-size="10" fill="#b91c1c" transform="rotate(-90 878,530)" text-anchor="middle">retry (max N attempts)</text>

  <!-- repair exhausted -> review queue -->
  <line x1="745" y1="646" x2="745" y2="672" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="758" y="663" font-size="10" fill="#b91c1c">attempts exhausted</text>

  <rect x="630" y="672" width="210" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="735" y="697" font-size="11" text-anchor="middle">review_queue.py — flag needs_human_review</text>

  <path d="M 735,712 L 735,740 L 460,740" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#arrowRed)"/>

  <!-- assemble -->
  <rect x="290" y="762" width="340" height="42" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="460" y="787" font-size="12.5" text-anchor="middle">assemble sections → full article wikitext</text>

  <line x1="460" y1="804" x2="460" y2="822" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- post-process -->
  <rect x="220" y="822" width="480" height="54" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="460" y="843" font-size="12.5" text-anchor="middle" font-weight="bold">citation_language.py + validator.py fixes</text>
  <text x="460" y="859" font-size="10.5" text-anchor="middle">|language= fill · CS1 param rename · {{sfn}} dedup</text>

  <line x1="380" y1="876" x2="270" y2="900" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="540" y1="876" x2="650" y2="900" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- output + report -->
  <rect x="120" y="900" width="300" height="44" rx="6" fill="#f3f4f6" stroke="#333"/>
  <text x="270" y="922" font-size="11.5" text-anchor="middle" font-weight="bold">output.py</text>
  <text x="270" y="937" font-size="10.5" text-anchor="middle">output/Article.wiki</text>

  <rect x="500" y="900" width="300" height="44" rx="6" fill="#f3f4f6" stroke="#333"/>
  <text x="650" y="922" font-size="11.5" text-anchor="middle" font-weight="bold">report.py</text>
  <text x="650" y="937" font-size="10.5" text-anchor="middle">output/Article.report.md</text>

  <line x1="270" y1="944" x2="270" y2="966" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="285" y="960" font-size="10" fill="#444">optional</text>
  <rect x="120" y="966" width="300" height="34" rx="6" fill="#fafafa" stroke="#666" stroke-dasharray="4 3"/>
  <text x="270" y="988" font-size="10.5" text-anchor="middle">live_validator.py — render check vs. live wiki templates</text>

  </g>
</svg>
