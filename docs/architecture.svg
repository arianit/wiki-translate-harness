<svg viewBox="0 0 990 430" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Translation pipeline in three steps. Prepare: fetch the article, verify links and templates, split into chunks. For each chunk: check the cache, translate, validate and repair. Whole article: assemble, fix and validate, optional review, write the output file and report. A chunk that stays invalid fails the article; an article with unfixed problems is withheld for human review.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="990" height="430" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#111111" font-size="11">

  <!-- 1. Prepare -->
  <text x="30" y="22" font-size="12" fill="#444" font-style="italic">1. Prepare</text>

  <rect x="30" y="35" width="200" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="130" y="60" font-size="12.5" text-anchor="middle" font-weight="bold">Fetch article</text>
  <text x="130" y="78" text-anchor="middle">Wikipedia API, file or folder</text>
  <line x1="230" y1="65" x2="270" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="35" width="200" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="370" y="60" font-size="12.5" text-anchor="middle" font-weight="bold">Verify facts</text>
  <text x="370" y="78" text-anchor="middle">links and templates, via Wikidata</text>
  <line x1="470" y1="65" x2="510" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="35" width="200" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="610" y="60" font-size="12.5" text-anchor="middle" font-weight="bold">Split into chunks</text>
  <text x="610" y="78" text-anchor="middle">by section</text>

  <path d="M 610,95 L 610,122 L 130,122 L 130,150" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Each chunk -->
  <text x="270" y="140" font-size="12" fill="#444" font-style="italic">2. Each chunk, several in parallel</text>

  <rect x="30" y="150" width="200" height="60" rx="6" fill="#fff7ed" stroke="#333"/>
  <text x="130" y="175" font-size="12.5" text-anchor="middle" font-weight="bold">Check cache</text>
  <text x="130" y="193" text-anchor="middle" fill="#15803d">hit: reuse, skip translation</text>
  <line x1="230" y1="180" x2="270" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="150" width="200" height="60" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="370" y="175" font-size="12.5" text-anchor="middle" font-weight="bold">Translate</text>
  <text x="370" y="193" text-anchor="middle">skill + verified facts, one of 5 engines</text>
  <line x1="470" y1="180" x2="510" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="150" width="200" height="60" rx="6" fill="#fff7ed" stroke="#333"/>
  <text x="610" y="175" font-size="12.5" text-anchor="middle" font-weight="bold">Validate and repair</text>
  <text x="610" y="193" text-anchor="middle">model fixes defects, up to N tries</text>
  <text x="610" y="228" text-anchor="middle" fill="#b91c1c">still invalid: the article fails</text>
  <line x1="710" y1="180" x2="750" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="750" y="150" width="200" height="60" rx="6" fill="#f0fdf4" stroke="#333"/>
  <text x="850" y="185" font-size="12.5" text-anchor="middle" font-weight="bold">Chunk ready</text>

  <path d="M 850,210 L 850,268 L 130,268 L 130,305" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Whole article -->
  <text x="270" y="296" font-size="12" fill="#444" font-style="italic">3. Whole article</text>

  <rect x="30" y="305" width="200" height="60" rx="6" fill="#eef2ff" stroke="#333"/>
  <text x="130" y="340" font-size="12.5" text-anchor="middle" font-weight="bold">Assemble sections</text>
  <line x1="230" y1="335" x2="270" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="305" width="200" height="60" rx="6" fill="#fff7ed" stroke="#333"/>
  <text x="370" y="330" font-size="12.5" text-anchor="middle" font-weight="bold">Fix and validate</text>
  <text x="370" y="348" text-anchor="middle">citation fixes, parse-API check</text>
  <text x="370" y="383" text-anchor="middle" fill="#444">problems: repair chunks, up to N rounds</text>
  <text x="370" y="399" text-anchor="middle" fill="#b91c1c">still failing: withheld for human review</text>
  <line x1="470" y1="335" x2="510" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="305" width="200" height="60" rx="6" fill="#ecfeff" stroke="#333"/>
  <text x="610" y="330" font-size="12.5" text-anchor="middle" font-weight="bold">Review (optional)</text>
  <text x="610" y="348" text-anchor="middle">second model reads the whole text</text>
  <line x1="710" y1="335" x2="750" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="750" y="305" width="200" height="60" rx="6" fill="#f0fdf4" stroke="#333"/>
  <text x="850" y="330" font-size="12.5" text-anchor="middle" font-weight="bold">Write output</text>
  <text x="850" y="348" text-anchor="middle">.wiki file and report</text>

  </g>
</svg>
