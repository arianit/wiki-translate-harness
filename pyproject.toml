[project]
name = "wiki-translate-harness"
version = "0.1.0"
description = "Batch harness that translates English Wikipedia articles into Albanian sq.wikipedia source, delegating all translation judgment to the enwiki-sqwiki-translation Pi skill."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "mwparserfromhell>=0.6.6",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "orjson>=3.10",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
wiki-translate-harness = "wiki_translate_harness.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wiki_translate_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
